version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    volumes:
      - ./frontend/src:/app/src
    command: pnpm dev

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./engine/nexow:/app/nexow
    command: uv run python -m nexow.main
    restart: unless-stopped
