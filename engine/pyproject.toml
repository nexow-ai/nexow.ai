[project]
name = "nexow-engine"
version = "0.1.0"
description = "Nexow trading engine - 24/7 algorithmic trading worker"
requires-python = ">=3.11"
dependencies = [
    "supabase",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydantic-ai",
    "langgraph",
    "langchain-openai",
    "pandas",
    "numpy",
    "ta",
    "python-dotenv",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
